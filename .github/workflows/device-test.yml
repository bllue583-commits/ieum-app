name: device-test

# Builds the real APK (with Whisper native code) and runs CallPipelineDeviceTest on an Android
# emulator: large-model download, Korean speed, m4a decode, transcript -> screens, screenshots.
on:
  push:
    branches: ['feature/**']
    paths: ['android/**', 'tools/run_device_test.sh', '.github/workflows/device-test.yml']
  workflow_dispatch:

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TINY_MODEL_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny-q5_1.bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: |
            gradle-user/caches
            gradle-user/wrapper
            models
          key: device-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build APKs
        run: |
          mkdir -p models
          [ -f models/ggml-tiny-q5_1.bin ] || curl -fsSL "$TINY_MODEL_URL" -o models/ggml-tiny-q5_1.bin
          export ANDROID_SDK_ROOT="$ANDROID_HOME" IEUM_NODE_BINARY="$(command -v node)" \
            IEUM_ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358" IEUM_CMAKE_BINARY="$ANDROID_HOME/cmake/3.22.1/bin/cmake" \
            IEUM_ANDROID_WHISPER_MODEL="$PWD/models/ggml-tiny-q5_1.bin"
          python3 run_gradle.py --log device-build.log :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 6144M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash tools/run_device_test.sh
      - name: Summarize
        if: always()
        run: |
          [ -f device-results/results.txt ] && sed 's/^/::notice title=device::/' device-results/results.txt | cut -c1-900 || true
          grep -E 'FAILURES|Error in|^OK|AssertionError|Exception' device-results/instrument.txt 2>/dev/null | head -20 | sed 's/^/::warning title=instrument::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-results
          retention-days: 7
          path: |
            device-results/
            evidence/device-build.log
