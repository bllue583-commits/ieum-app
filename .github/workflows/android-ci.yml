name: ci

# Build and test on GitHub-hosted runners. The development workspace has no access to the
# Gradle/Maven/Android repositories, so this is where Kotlin compiles and JVM tests run.
on:
  push:
    branches: ['feature/**', 'main']
    # release-apk waits for this run on the same commit, so every path that releases also runs the tests.
    paths: ['android/**', 'tools/**', '.github/workflows/android-ci.yml', '.github/workflows/release-apk.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      IEUM_SKIP_ANDROID_NATIVE: '1'
      ROBOLECTRIC_JAR_URL: https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/15-robolectric-13954326-i7/android-all-instrumented-15-robolectric-13954326-i7.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - uses: actions/cache@v4
        with:
          path: |
            gradle-user/caches
            gradle-user/wrapper
            robolectric-jar
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: UI rules and tool tests
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py' -t tools
          python3 -m unittest discover -s tools/inbox -p 'test_*.py'
          python3 tools/check_ui_rules.py
      # Secrets and the like block; a personal home path only warns until the old ones in docs are replaced (design H5).
      - name: Export scan
        run: |
          set +e
          python3 tools/scan_export.py > "$RUNNER_TEMP/scan.json"
          python3 - "$RUNNER_TEMP/scan.json" <<'EOF'
          import json, sys
          findings = json.load(open(sys.argv[1]))["findings"]
          blocking = [f for f in findings if f["reason"] != "home_path"]
          for f in findings:
              kind = "warning" if f["reason"] == "home_path" else "error"
              print(f"::{kind} title=export scan::{f['path']}:{f.get('line', '')} {f['reason']}")
          print(f"export scan: {len(findings)} finding(s), {len(blocking)} blocking")
          sys.exit(1 if blocking else 0)
          EOF
      # The phone shows the first line of docs/UPDATE_NOTE.txt as the update note: remind, never block (design H4).
      - name: Update note reminder
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git fetch --no-tags --depth=1 origin "$BEFORE" > /dev/null 2>&1; then
            echo "no earlier commit to compare with: update note not checked"; exit 0
          fi
          changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if echo "$changed" | grep -qE '^android/[^/]+/src/main/' && ! echo "$changed" | grep -qx 'docs/UPDATE_NOTE.txt'; then
            echo "::warning title=update note::app code changed but docs/UPDATE_NOTE.txt did not: if users see a change, update its first line"
          else
            echo "update note: nothing to remind"
          fi
      - name: Prepare Robolectric runtime
        run: |
          mkdir -p robolectric-jar
          [ -f robolectric-jar/android-all.jar ] || curl -fsSL "$ROBOLECTRIC_JAR_URL" -o robolectric-jar/android-all.jar
          python3 tools/prepare_host_tests.py robolectric-jar/android-all.jar
      - name: JVM tests and lint
        id: gradle
        env:
          IEUM_SHOTS_DIR: ${{ github.workspace }}/evidence/shots # v3.4 (r14-4): card and home pictures from the host tests
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          python3 run_gradle.py --log ci-gradle.log :core:test :app:testDebugUnitTest :app:lintDebug
      - name: Summarize results
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET
          tests = fails = skips = 0; lines = []
          for path in glob.glob('android/**/build/test-results/**/*.xml', recursive=True):
              root = ET.parse(path).getroot()
              for case in root.iter('testcase'):
                  tests += 1
                  if case.find('skipped') is not None: skips += 1
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      fails += 1
                      msg = (bad.get('message') or '').replace('\n', ' ')[:300]
                      lines.append(f"{case.get('classname')}.{case.get('name')}: {msg}")
          print(f"JVM tests: {tests}, failed: {fails}, skipped: {skips}")
          for l in lines[:50]: print(f"::error title=jvm test::{l}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"JVM tests: {tests}, failed: {fails}, skipped: {skips}\n\n" + "\n".join('- ' + l for l in lines[:50]) + "\n")
          EOF
          if [ -f evidence/ci-gradle.log ]; then
            grep -E '^e: |error:|FAILED|BUILD (SUCCESSFUL|FAILED)' evidence/ci-gradle.log | head -60 | while IFS= read -r line; do echo "::warning title=gradle::${line:0:400}"; done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          retention-days: 7
          path: |
            evidence/ci-gradle.log
            evidence/shots/*.png
            android/**/build/test-results/**/*.xml
            android/app/build/reports/lint-results-debug.*
