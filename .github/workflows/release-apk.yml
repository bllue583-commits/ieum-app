name: release-apk

# Every push builds the phone APK (Whisper native code, inbox token, stable signing key derived from the
# same secret) and publishes it to the private inbox repo, where the installed app finds it and offers
# a one-tap update. Needs the repository secret IEUM_INBOX_TOKEN.
on:
  push:
    branches: ['feature/lean-calls', 'main']
    paths: ['android/**', 'tools/**', '.github/workflows/release-apk.yml']
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INBOX: bllue583-commits/ieum-inbox
    steps:
      # Nothing reaches the phone unless the unit tests and lint passed on this very commit (ci, android-ci.yml).
      - name: Wait for ci on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 80); do
            c=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android-ci.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null)
            case "$c" in
              "completed success") echo "ci passed"; exit 0;;
              completed*) echo "ci did not pass ($c): not releasing"; exit 1;;
            esac
            sleep 30
          done
          echo "ci did not finish in 40 minutes: not releasing"; exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: |
            gradle-user/caches
            gradle-user/wrapper
          key: device-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build signed APK
        env:
          IEUM_INBOX_TOKEN: ${{ secrets.IEUM_INBOX_TOKEN }}
          # Optional. When set, the signing key comes from it, so the mailbox token can change without breaking updates.
          # When empty, the key is derived from IEUM_INBOX_TOKEN as before (same certificate for the same value).
          IEUM_SIGNING_SEED: ${{ secrets.IEUM_SIGNING_SEED }}
        run: |
          [ -n "$IEUM_INBOX_TOKEN" ] || { echo "::error title=release::IEUM_INBOX_TOKEN secret is not set"; exit 1; }
          [ -z "$IEUM_SIGNING_SEED" ] || echo "::add-mask::$IEUM_SIGNING_SEED"
          pip install --quiet 'cryptography>=44'
          python3 tools/derive_signing_key.py "$RUNNER_TEMP/ieum.p12"
          export ANDROID_SDK_ROOT="$ANDROID_HOME" \
            IEUM_ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358" IEUM_CMAKE_BINARY="$ANDROID_HOME/cmake/3.22.1/bin/cmake" \
            IEUM_SIGNING_KEYSTORE="$RUNNER_TEMP/ieum.p12" IEUM_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          python3 run_gradle.py --log release-build.log :app:assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/ieum.apk"
      # An update only installs over the old app when both APKs carry the same signing certificate.
      - name: Compare signing certificate with the previous release
        env:
          GH_TOKEN: ${{ secrets.IEUM_INBOX_TOKEN }}
        run: |
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          fp() { "$apksigner" verify --print-certs "$1" 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1; }
          new=$(fp "$RUNNER_TEMP/ieum.apk")
          [ -n "$new" ] || { echo "::error title=release::could not read the new APK's signing certificate"; exit 1; }
          asset=$(gh api "repos/$INBOX/contents/app/version.json" --jq .content 2>/dev/null | base64 -d 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin)['apk'].rsplit('/',1)[-1])" 2>/dev/null || true)
          if [ -z "$asset" ] || ! gh api -H "Accept: application/octet-stream" "repos/$INBOX/releases/assets/$asset" > "$RUNNER_TEMP/previous.apk" 2>/dev/null; then
            echo "::warning title=release::previous APK could not be downloaded: signing certificate not compared"; exit 0
          fi
          old=$(fp "$RUNNER_TEMP/previous.apk")
          if [ -z "$old" ]; then echo "::warning title=release::previous APK certificate unreadable: not compared"; exit 0; fi
          if [ "$old" != "$new" ]; then
            echo "::error title=release::signing certificate differs from the previous release (old $old, new $new): not publishing, phones could not update"; exit 1
          fi
          echo "signing certificate unchanged ($new)"
      - name: Publish to the inbox repo
        env:
          GH_TOKEN: ${{ secrets.IEUM_INBOX_TOKEN }}
        run: |
          code=$((1000 + GITHUB_RUN_NUMBER)); tag="v$code"
          sha=$(sha256sum "$RUNNER_TEMP/ieum.apk" | cut -d' ' -f1)
          # The phone shows this to the user: plain Korean from docs/UPDATE_NOTE.txt, never the developer commit message.
          # Cut by characters, not bytes: a byte cut breaks Korean text in the middle of a letter.
          notes=$(head -n 1 docs/UPDATE_NOTE.txt 2>/dev/null | python3 -c "import sys; sys.stdout.write(sys.stdin.buffer.read().decode('utf-8','ignore').strip()[:120])")
          [ -n "$notes" ] || notes="더 안정적으로 고쳤어요"
          # An empty repository cannot hold releases: give it a first file.
          gh api "repos/$INBOX/contents/README.md" >/dev/null 2>&1 || gh api -X PUT "repos/$INBOX/contents/README.md" -f message="init" \
            -f content="$(printf '# ieum-inbox\n\n이음 앱의 통화 분석 우편함과 업데이트 파일 (자동 관리)\n' | base64 -w0)" >/dev/null
          gh release delete "$tag" --repo "$INBOX" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$RUNNER_TEMP/ieum.apk#ieum.apk" --repo "$INBOX" --title "이음 $tag" --notes "$notes"
          asset=$(gh api "repos/$INBOX/releases/tags/$tag" --jq '.assets[] | select(.name=="ieum.apk") | .id')
          python3 - "$code" "$asset" "$sha" "$notes" > version.json <<'EOF'
          import json, sys
          code, asset, sha, notes = sys.argv[1:]
          import pathlib
          v = pathlib.Path("docs/VERSION")
          name = "v" + v.read_text(encoding="utf-8").strip() if v.is_file() and v.read_text(encoding="utf-8").strip() else "v" + code
          print(json.dumps({"versionCode": int(code), "versionName": name, "apk": "releases/assets/" + asset, "sha256": sha, "notes": notes}, ensure_ascii=False))
          EOF
          old=$(gh api "repos/$INBOX/contents/app/version.json" --jq .sha 2>/dev/null || true)
          gh api -X PUT "repos/$INBOX/contents/app/version.json" -f message="app $tag" -f content="$(base64 -w0 version.json)" ${old:+-f sha="$old"} > /dev/null
          # Keep the three newest releases.
          gh release list --repo "$INBOX" --limit 50 --json tagName --jq '.[3:][].tagName' | while read -r t; do gh release delete "$t" --repo "$INBOX" --yes --cleanup-tag; done
          echo "::notice title=release::$tag published ($sha)"
