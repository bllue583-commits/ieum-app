name: release-apk

# Every push builds the phone APK (Whisper native code, inbox token, stable signing key derived from the
# same secret) and publishes it to the private inbox repo, where the installed app finds it and offers
# a one-tap update. Needs the repository secret IEUM_INBOX_TOKEN.
# It waits for ci on the same commit, and, when the commit changes start-up code or build settings since the last
# release (tools/needs_update_smoke.sh), also for the update smoke test (update-smoke.yml) on the same commit: an app
# failure there stops the release; only an emulator that did not boot after one retry (runner problem) just warns.
# version.json carries the APK size in bytes ("size") so the phone can show download progress.
# v3.8 r18-lock (DESIGN_V7 4.2): the published APK is the release build type (not debuggable, no synthetic tools), signed with
# the same key as before; with the repository variable IEUM_ROTATE=1 it is re-signed with the rotated key and the key lineage
# kept in the mailbox (tools/rotate_signing_key.sh). version.json says which (buildType, seedIndependent, lineageSha256), and a
# gitleaks scan of the whole history goes to the mailbox as status/secrets-scan.json.
on:
  push:
    branches: ['feature/lean-calls', 'main']
    paths: ['android/**', 'tools/**', '.github/workflows/release-apk.yml']
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      INBOX: bllue583-commits/ieum-inbox
    steps:
      # Nothing reaches the phone unless the unit tests and lint passed on this very commit (ci, android-ci.yml).
      - name: Wait for ci on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 80); do
            c=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android-ci.yml --commit "$GITHUB_SHA" --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"' 2>/dev/null)
            case "$c" in
              "completed success") echo "ci passed"; exit 0;;
              completed*) echo "ci did not pass ($c): not releasing"; exit 1;;
            esac
            sleep 30
          done
          echo "ci did not finish in 40 minutes: not releasing"; exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan below reads the whole history
      # Only for a commit that changes the manifest, IeumApplication, StartupReceiver, CallSinkImpl or the build settings
      # since the last release: the emulator must have installed it over the previous release and started it (design H1).
      - name: Wait for update-smoke on this commit (start-up or build changes only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(bash tools/needs_update_smoke.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"); echo "$out"
          [ "$(echo "$out" | tail -n 1)" = "true" ] || { echo "no update smoke test needed"; exit 0; }
          for i in $(seq 1 140); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update-smoke.yml --commit "$GITHUB_SHA" --json databaseId,status,conclusion --jq '.[0] | "\(.databaseId) \(.status) \(.conclusion)"' 2>/dev/null)
            if [ -z "$run" ] || [ "$run" = "null null null" ]; then
              # A manual release has no push run to wait for: the person who started it decided.
              if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$i" -ge 4 ]; then echo "::warning title=release::manual release without an update smoke test run"; exit 0; fi
              sleep 30; continue
            fi
            set -- $run
            [ "$2" = "completed" ] || { sleep 30; continue; }
            # Gate (design H1): the app must have installed over the previous release and started on the emulator.
            # Only "the emulator never booted, even after update-smoke's one automatic retry" (runner problem) warns.
            step() { gh run view "$1" --repo "$GITHUB_REPOSITORY" --json jobs --jq "[.jobs[].steps[] | select(.name==\"$2\") | .conclusion] | first // empty"; }
            smoke=$(step "$1" "Install, update, start"); infra=$(step "$1" "Emulator did not boot (infra)")
            if [ "$smoke" = "success" ]; then echo "update smoke test passed (run $1)"; exit 0; fi
            if [ "$infra" = "failure" ]; then
              echo "::warning title=release::update-smoke run $1: the emulator did not boot in two attempts (runner problem, not the app): releasing with a warning"; exit 0
            fi
            echo "::error title=release::update-smoke run $1 did not pass ($3; Install, update, start: ${smoke:-not run}): not releasing. The app failed to install over the previous release, update or start, or the test did not run; fix it or re-run update-smoke for this commit."; exit 1
          done
          echo "::error title=release::update smoke test did not finish in 70 minutes: not releasing"; exit 1
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: |
            gradle-user/caches
            gradle-user/wrapper
          key: device-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build signed APK
        env:
          IEUM_INBOX_TOKEN: ${{ secrets.IEUM_INBOX_TOKEN }}
          # Optional. When set, the signing key comes from it, so the mailbox token can change without breaking updates.
          # When empty, the key is derived from IEUM_INBOX_TOKEN as before (same certificate for the same value).
          IEUM_SIGNING_SEED: ${{ secrets.IEUM_SIGNING_SEED }}
          # v3.5: Kakao native app key; empty = the KakaoTalk morning report hides itself (the build still works).
          IEUM_KAKAO_APP_KEY: ${{ secrets.IEUM_KAKAO_APP_KEY }}
          # r18: the user's own 5-item KakaoTalk list template and the web view's address (repository variables, not secrets;
          # empty = Kakao's default list of 3 and no [웹으로 보기]). docs/OPERATIONS.md says how to make both.
          IEUM_KAKAO_LIST_TEMPLATE_ID: ${{ vars.IEUM_KAKAO_LIST_TEMPLATE_ID }}
          IEUM_KAKAO_WEB_BASE: ${{ vars.IEUM_KAKAO_WEB_BASE }}
          # r18-lock: with IEUM_ROTATE=1 Gradle signs with the new key (re-signed with the lineage below); the old key is not made.
          ROTATE: ${{ vars.IEUM_ROTATE }}
          IEUM_SIGNING_SEED_V2: ${{ vars.IEUM_ROTATE == '1' && secrets.IEUM_SIGNING_SEED_V2 || '' }}
        run: |
          [ -n "$IEUM_INBOX_TOKEN" ] || { echo "::error title=release::IEUM_INBOX_TOKEN secret is not set"; exit 1; }
          [ -n "$IEUM_KAKAO_APP_KEY" ] || echo "::warning title=release::IEUM_KAKAO_APP_KEY is not set: KakaoTalk morning report hidden in this build"
          [ -z "$IEUM_SIGNING_SEED" ] || echo "::add-mask::$IEUM_SIGNING_SEED"
          [ -z "$IEUM_SIGNING_SEED_V2" ] || echo "::add-mask::$IEUM_SIGNING_SEED_V2"
          # Pinned: the certificate must come out byte-identical every build (checked with 50.0.1 and 50.0.2: same fingerprint).
          pip install --quiet 'cryptography==50.0.2'
          if [ "$ROTATE" = "1" ]; then
            [ -n "$IEUM_SIGNING_SEED_V2" ] || { echo "::error title=release::IEUM_ROTATE is 1 but the secret IEUM_SIGNING_SEED_V2 is not set: not releasing"; exit 1; }
            python3 tools/derive_signing_key.py --seed-env IEUM_SIGNING_SEED_V2 "$RUNNER_TEMP/ieum.p12"
          else
            python3 tools/derive_signing_key.py "$RUNNER_TEMP/ieum.p12"
          fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME" \
            IEUM_ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358" IEUM_CMAKE_BINARY="$ANDROID_HOME/cmake/3.22.1/bin/cmake" \
            IEUM_SIGNING_KEYSTORE="$RUNNER_TEMP/ieum.p12" IEUM_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          # r18-lock (DESIGN_V7 4.2-3): the release build type (debuggable off, SYNTHETIC_TOOLS off, no minify), same signing
          # config as debug; lintVitalRelease runs inside it and stops the release on a fatal lint error.
          python3 run_gradle.py --log release-build.log :app:assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/ieum.apk"
          rm -f "$RUNNER_TEMP/ieum.p12"
      # Key rotation (DESIGN_V7 4.2, tools/rotate_signing_key.sh): only when the repository variable IEUM_ROTATE is 1.
      # Otherwise this step does nothing and the APK keeps exactly the old key and fingerprint.
      # The lineage is the mailbox's app/signing-lineage.bin; only when there is none yet (the first rotated release) it is made
      # from the old key (IEUM_SIGNING_SEED, or the token as every release so far) and goes up with this release.
      - name: Re-sign with the stored key lineage (IEUM_ROTATE=1 only)
        if: vars.IEUM_ROTATE == '1'
        env:
          GH_TOKEN: ${{ secrets.IEUM_INBOX_TOKEN }}
          IEUM_INBOX_TOKEN: ${{ secrets.IEUM_INBOX_TOKEN }}
          IEUM_SIGNING_SEED: ${{ secrets.IEUM_SIGNING_SEED }}
          IEUM_SIGNING_SEED_V2: ${{ secrets.IEUM_SIGNING_SEED_V2 }}
        run: |
          [ -n "$IEUM_SIGNING_SEED_V2" ] || { echo "::error title=release::IEUM_ROTATE is 1 but the secret IEUM_SIGNING_SEED_V2 is not set: not releasing"; exit 1; }
          echo "::add-mask::$IEUM_SIGNING_SEED_V2"
          [ -z "$IEUM_SIGNING_SEED" ] || echo "::add-mask::$IEUM_SIGNING_SEED"
          export APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          dir="$RUNNER_TEMP/rotate"; lin="$RUNNER_TEMP/signing-lineage.bin"
          bash tools/rotate_signing_key.sh newkey "$dir" || { echo "::error title=release::the new key could not be made from IEUM_SIGNING_SEED_V2 (32 characters or more): not releasing"; exit 1; }
          if got=$(gh api "repos/$INBOX/contents/app/signing-lineage.bin" --jq .content 2>&1); then
            echo "$got" | base64 -d > "$lin"; echo "LINEAGE_NEW=0" >> "$GITHUB_ENV"; echo "stored lineage: $(bash tools/rotate_signing_key.sh certs "$lin" | tr '\n' ' ')"
          elif echo "$got" | grep -q "HTTP 404"; then
            echo "no stored lineage: the first rotated release makes it now (from the old key, once)"
            bash tools/rotate_signing_key.sh lineage "$dir" "$lin"; echo "LINEAGE_NEW=1" >> "$GITHUB_ENV"
          else
            echo "::error title=release::the stored lineage could not be read (not a 404): not releasing ($got)"; exit 1
          fi
          bash tools/rotate_signing_key.sh sign "$dir" "$lin" "$RUNNER_TEMP/ieum.apk"
          rm -f "$dir/new.p12"
      # An update only installs over the old app when both APKs carry the same signing certificate,
      # or, with IEUM_ROTATE=1, when the new APK's lineage starts at the previous release's certificate.
      # v3.5: the key hash developers.kakao.com asks for (platform > Android); public value, base64 of the signer's SHA-1.
      - name: Kakao key hash
        continue-on-error: true
        run: |
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          sha1=$("$apksigner" verify --print-certs "$RUNNER_TEMP/ieum.apk" | grep -m1 'SHA-1 digest' | awk '{print $NF}')
          hash=$(echo "$sha1" | xxd -r -p | base64)
          echo "Kakao key hash: $hash"
          echo "### Kakao key hash: \`$hash\`" >> "$GITHUB_STEP_SUMMARY"
          # r18-lock: a rotated APK is signed by the new key, so this hash is new: it must be added in developers.kakao.com
          # (keep the old one too) or the KakaoTalk report stops (docs/OPERATIONS.md "서명 키 교체").
          [ "${{ vars.IEUM_ROTATE }}" != "1" ] || echo "::warning title=release::signed with the rotated key: add the Kakao key hash $hash in developers.kakao.com (platform > Android), keep the old one"
      - name: Compare signing certificate with the previous release
        env:
          GH_TOKEN: ${{ secrets.IEUM_INBOX_TOKEN }}
          ROTATE: ${{ vars.IEUM_ROTATE }}
        run: |
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          # Same value as before for an unrotated APK ("Signer #1"); the newest signer for a lineage-signed one.
          fp() { APKSIGNER="$apksigner" bash tools/rotate_signing_key.sh fp "$1"; }
          new=$(fp "$RUNNER_TEMP/ieum.apk")
          [ -n "$new" ] || { echo "::error title=release::could not read the new APK's signing certificate"; exit 1; }
          if [ "$ROTATE" = "1" ]; then
            # r18-lock: a rotated APK shows the new certificate, so "unchanged" is not the test. Every time: the lineage must end
            # at the new key and start at the previous release's certificate (first rotated release), or be the very lineage
            # the previous release carries. Without the previous APK, version.json decides; knowing nothing stops the release.
            gh api "repos/$INBOX/contents/app/version.json" --jq .content 2>/dev/null | base64 -d > "$RUNNER_TEMP/prev-version.json" 2>/dev/null || true
            asset=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['apk'].rsplit('/',1)[-1])" "$RUNNER_TEMP/prev-version.json" 2>/dev/null || true)
            [ -n "$asset" ] && gh api -H "Accept: application/octet-stream" "repos/$INBOX/releases/assets/$asset" > "$RUNNER_TEMP/previous.apk" 2>/dev/null || rm -f "$RUNNER_TEMP/previous.apk"
            APKSIGNER="$apksigner" bash tools/rotate_signing_key.sh check "$RUNNER_TEMP/signing-lineage.bin" "$(cat "$RUNNER_TEMP/rotate/new.sha256")" \
              "$( [ -s "$RUNNER_TEMP/previous.apk" ] && echo "$RUNNER_TEMP/previous.apk" )" "$RUNNER_TEMP/prev-version.json" \
              || { echo "::error title=release::rotated APK does not chain to the previous release: not publishing"; exit 1; }
            [ "$new" = "$(cat "$RUNNER_TEMP/rotate/new.sha256")" ] || { echo "::error title=release::rotated APK is not signed by the new key"; exit 1; }
            exit 0
          fi
          # v3.1 (DESIGN_V4 2.2-2): version.json carries the published certificate, so the comparison works even when the
          # previous APK cannot be downloaded (1034-1038 were never compared for that reason).
          prev_cert=$(gh api "repos/$INBOX/contents/app/version.json" --jq .content 2>/dev/null | base64 -d 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('certSha256',''))" 2>/dev/null || true)
          asset=$(gh api "repos/$INBOX/contents/app/version.json" --jq .content 2>/dev/null | base64 -d 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin)['apk'].rsplit('/',1)[-1])" 2>/dev/null || true)
          if [ -z "$asset" ] || ! gh api -H "Accept: application/octet-stream" "repos/$INBOX/releases/assets/$asset" > "$RUNNER_TEMP/previous.apk" 2>/dev/null; then
            if [ -n "$prev_cert" ] && [ "$ROTATE" != "1" ]; then
              [ "$(echo "$new" | tr 'A-F' 'a-f' | tr -d ':')" = "$prev_cert" ] || { echo "::error title=release::signing certificate differs from version.json certSha256 ($prev_cert): not publishing"; exit 1; }
              echo "signing certificate matches version.json certSha256"; exit 0
            fi
            echo "::warning title=release::previous APK could not be downloaded: signing certificate not compared"; exit 0
          fi
          old=$(fp "$RUNNER_TEMP/previous.apk")
          if [ -z "$old" ]; then echo "::warning title=release::previous APK certificate unreadable: not compared"; exit 0; fi
          if [ "$old" != "$new" ]; then
            echo "::error title=release::signing certificate differs from the previous release (old $old, new $new): not publishing, phones could not update"; exit 1
          fi
          echo "signing certificate unchanged ($new)"
      - name: Publish to the inbox repo
        env:
          GH_TOKEN: ${{ secrets.IEUM_INBOX_TOKEN }}
          ROTATE: ${{ vars.IEUM_ROTATE }}
        run: |
          code=$((1000 + GITHUB_RUN_NUMBER)); tag="v$code"
          sha=$(sha256sum "$RUNNER_TEMP/ieum.apk" | cut -d' ' -f1)
          # The phone shows this to the user: plain Korean from docs/UPDATE_NOTE.txt, never the developer commit message.
          # Cut by characters, not bytes: a byte cut breaks Korean text in the middle of a letter.
          notes=$(head -n 1 docs/UPDATE_NOTE.txt 2>/dev/null | python3 -c "import sys; sys.stdout.write(sys.stdin.buffer.read().decode('utf-8','ignore').strip()[:120])")
          [ -n "$notes" ] || notes="더 안정적으로 고쳤어요"
          # An empty repository cannot hold releases: give it a first file.
          gh api "repos/$INBOX/contents/README.md" >/dev/null 2>&1 || gh api -X PUT "repos/$INBOX/contents/README.md" -f message="init" \
            -f content="$(printf '# ieum-inbox\n\n이음 앱의 통화 분석 우편함과 업데이트 파일 (자동 관리)\n' | base64 -w0)" >/dev/null
          gh release delete "$tag" --repo "$INBOX" --yes --cleanup-tag 2>/dev/null || true
          # r18-lock: a rotated release carries its lineage file too (a second copy beside app/signing-lineage.bin).
          extra=(); [ "$ROTATE" != "1" ] || extra=("$RUNNER_TEMP/signing-lineage.bin#signing-lineage.bin")
          gh release create "$tag" "$RUNNER_TEMP/ieum.apk#ieum.apk" "${extra[@]}" --repo "$INBOX" --title "이음 $tag" --notes "$notes"
          asset=$(gh api "repos/$INBOX/releases/tags/$tag" --jq '.assets[] | select(.name=="ieum.apk") | .id')
          size=$(stat -c %s "$RUNNER_TEMP/ieum.apk")
          python3 - "$code" "$asset" "$sha" "$notes" "$size" > version.json <<'EOF'
          import json, sys
          code, asset, sha, notes, size = sys.argv[1:]
          import pathlib
          v = pathlib.Path("docs/VERSION")
          name = "v" + v.read_text(encoding="utf-8").strip() if v.is_file() and v.read_text(encoding="utf-8").strip() else "v" + code
          print(json.dumps({"versionCode": int(code), "versionName": name, "apk": "releases/assets/" + asset, "sha256": sha, "size": int(size), "notes": notes}, ensure_ascii=False))
          EOF
          # v3.1 (DESIGN_V4 2.2-2): promptVersion, tidyVersion and certSha256 for the watchdog, which never reads this repository.
          # r18-lock (DESIGN_V7 4.2; the scorecard's item 8): buildType, seedIndependent, and the lineage file's sha256 when rotated.
          if [ "$ROTATE" = "1" ]; then rot=(--seed-independent true --lineage "$RUNNER_TEMP/signing-lineage.bin"); else rot=(--seed-independent false); fi
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner" python3 tools/release/version_fields.py --root . --apk "$RUNNER_TEMP/ieum.apk" \
            --build-type release "${rot[@]}" --merge version.json
          # r18-lock: the lineage goes up before version.json, so no run ever sees a rotated release without its lineage.
          if [ "$ROTATE" = "1" ]; then
            prev_lin=$(gh api "repos/$INBOX/contents/app/signing-lineage.bin" --jq .sha 2>/dev/null || true)
            if [ -z "$prev_lin" ] || [ "$(git hash-object "$RUNNER_TEMP/signing-lineage.bin")" != "$prev_lin" ]; then
              gh api -X PUT "repos/$INBOX/contents/app/signing-lineage.bin" -f message="signing lineage for $tag" \
                -f content="$(base64 -w0 "$RUNNER_TEMP/signing-lineage.bin")" ${prev_lin:+-f sha="$prev_lin"} > /dev/null
              echo "::notice title=release::key lineage stored in the mailbox (app/signing-lineage.bin)"
            fi
          fi
          # v3.4: the scheduled tasks read their instructions and the watchdog from the inbox, so the copies go up with the app
          # (before version.json, so a routine never meets a newer app with older instructions).
          for pair in "docs/routines/hourly.md:routines/hourly.md" "docs/routines/tidy.md:routines/tidy.md" "tools/inbox/watchdog.py:tools/watchdog.py" "tools/report_check.py:tools/report_check.py"; do
            src=${pair%%:*}; dst=${pair#*:}
            prev=$(gh api "repos/$INBOX/contents/$dst" --jq .sha 2>/dev/null || true)
            if [ -n "$prev" ] && [ "$(git hash-object "$src")" = "$prev" ]; then continue; fi
            gh api -X PUT "repos/$INBOX/contents/$dst" -f message="$dst for $tag" -f content="$(base64 -w0 "$src")" ${prev:+-f sha="$prev"} > /dev/null
          done
          old=$(gh api "repos/$INBOX/contents/app/version.json" --jq .sha 2>/dev/null || true)
          gh api -X PUT "repos/$INBOX/contents/app/version.json" -f message="app $tag" -f content="$(base64 -w0 version.json)" ${old:+-f sha="$old"} > /dev/null
          # Keep the three newest releases. The new release is already out: a failed clean-up only warns (the API sometimes answers 500).
          old_tags=$(gh release list --repo "$INBOX" --limit 50 --json tagName --jq '.[3:][].tagName' 2>/dev/null) || { echo "::warning title=release::old releases could not be listed: not cleaned up"; old_tags=""; }
          for t in $old_tags; do
            gh release delete "$t" --repo "$INBOX" --yes --cleanup-tag > /dev/null 2>&1 || echo "::warning title=release::old release $t could not be deleted (left for the next run)"
          done
          echo "::notice title=release::$tag published ($sha)"
      # r18-lock (DESIGN_V7 4.2): gitleaks over the whole history, the count to the mailbox for the scorecard (item 8). After the
      # release, never in its way: ci (android-ci.yml) already failed on a finding for this commit.
      - name: Secret scan to the mailbox
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.IEUM_INBOX_TOKEN }}
        run: |
          bash tools/secret_scan.sh "$RUNNER_TEMP/secrets-scan.json" || true
          [ -s "$RUNNER_TEMP/secrets-scan.json" ] || { echo "::warning title=release::secret scan did not run"; exit 0; }
          prev=$(gh api "repos/$INBOX/contents/status/secrets-scan.json" --jq .sha 2>/dev/null || true)
          gh api -X PUT "repos/$INBOX/contents/status/secrets-scan.json" -f message="secret scan for $GITHUB_SHA" \
            -f content="$(base64 -w0 "$RUNNER_TEMP/secrets-scan.json")" ${prev:+-f sha="$prev"} > /dev/null
          cat "$RUNNER_TEMP/secrets-scan.json"
