name: claude-live

# Real Claude call with a public synthetic transcript (ClaudeLiveTest). Needs the repository secret
# ANTHROPIC_API_KEY; without it the test is skipped. The key is never printed.
# Subscription mode is the default now; this API check runs only on demand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IEUM_SKIP_ANDROID_NATIVE: '1'
      ROBOLECTRIC_JAR_URL: https://repo1.maven.org/maven2/org/robolectric/android-all-instrumented/15-robolectric-13954326-i7/android-all-instrumented-15-robolectric-13954326-i7.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'
      - uses: actions/cache@v4
        with:
          path: |
            gradle-user/caches
            gradle-user/wrapper
            robolectric-jar
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Real Claude call
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning title=claude-live::ANTHROPIC_API_KEY secret is not set"; exit 1; fi
          mkdir -p robolectric-jar
          [ -f robolectric-jar/android-all.jar ] || curl -fsSL "$ROBOLECTRIC_JAR_URL" -o robolectric-jar/android-all.jar
          python3 tools/prepare_host_tests.py robolectric-jar/android-all.jar
          export ANDROID_SDK_ROOT="$ANDROID_HOME" IEUM_NODE_BINARY="$(command -v node)"
          set +e
          python3 run_gradle.py --log claude-live.log :app:testDebugUnitTest --tests 'kr.callbrief.pipeline.ClaudeLiveTest'
          status=$?
          f=android/app/build/claude-live.json
          [ -f "$f" ] && echo "::notice title=claude-live::$(tr -d '\n' < $f | cut -c1-1500)"
          grep -h -o 'message="[^"]*"' android/app/build/test-results/testDebugUnitTest/*ClaudeLiveTest*.xml 2>/dev/null | head -5 | sed 's/^/::error title=claude-live::/'
          grep -c '<skipped' android/app/build/test-results/testDebugUnitTest/*ClaudeLiveTest*.xml && { echo "::error title=claude-live::test was skipped"; exit 1; }
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-live
          retention-days: 14
          path: |
            android/app/build/claude-live.json
            android/app/build/test-results/testDebugUnitTest/*ClaudeLiveTest*.xml
