name: update-smoke

# Design H1. Installs the previous release APK from the inbox repository on an emulator, installs the freshly built
# APK over it (same signing key, higher version code), starts the app and checks for crashes and for the scheduled work.
# Runs on every push that release-apk runs on; the emulator part only when tools/needs_update_smoke.sh says the push
# changed, since the last release, a manifest, IeumApplication, StartupReceiver, CallSinkImpl or the build settings.
# For those pushes release-apk waits for the step "Install, update, start" here to pass; other pushes finish at once.
# An emulator that does not boot (runner problem) is retried once; if it still does not boot, the step
# "Emulator did not boot (infra)" fails instead, and release-apk only warns. An app failure always stops the release.
# Needs the secrets IEUM_INBOX_TOKEN (and IEUM_SIGNING_SEED if release-apk uses it; IEUM_SIGNING_SEED_V2 once IEUM_ROTATE=1).
# Manual run with rotate_test=true: rehearses key rotation (tools/rotate_signing_key.sh) on the emulator.
# v3.8 r18-lock (DESIGN_V7 4.2): the new APK is the release build type (the previous release is still a debug build until
# v3.8 build B is out), so every run checks debug -> release over the top with the data kept. With rotate_test=true (or
# IEUM_ROTATE=1) the lineage is made once (from the release key, like the first rotated release), the old key deleted, and two
# builds are signed with the new key and that lineage only: the first over the current release, the second over the first.
on:
  push:
    branches: ['feature/lean-calls', 'main']
    paths: ['android/**', 'tools/**', '.github/workflows/release-apk.yml', '.github/workflows/update-smoke.yml']
  workflow_dispatch:
    inputs:
      rotate_test:
        description: 'Rehearse key rotation: sign the new APK with a lineage from the release key to a throwaway key made in this run (never released)'
        type: boolean
        default: false

concurrency:
  group: update-smoke-${{ github.ref }}
  # A push run is what release-apk waits for: never cancelled by the next push.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      INBOX: bllue583-commits/ieum-inbox
    steps:
      - uses: actions/checkout@v4
      - name: Decide
        id: need
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "manual run: smoke test runs"; exit 0; fi
          out=$(bash tools/needs_update_smoke.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"); echo "$out"
          echo "run=$(echo "$out" | tail -n 1)" >> "$GITHUB_OUTPUT"
      # r18-lock: the Kakao key hash the rotated key will have, before IEUM_ROTATE is turned on (docs/OPERATIONS.md "서명 키
      # 교체"): it must be added in developers.kakao.com first. Public value (base64 of the certificate's SHA-1); the seed stays
      # in the secret. Only on a manual run, only when the secret IEUM_SIGNING_SEED_V2 exists.
      - name: Kakao key hash of the rotated key (manual run, IEUM_SIGNING_SEED_V2 set)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          IEUM_SIGNING_SEED_V2: ${{ secrets.IEUM_SIGNING_SEED_V2 }}
        run: |
          [ -n "$IEUM_SIGNING_SEED_V2" ] || { echo "IEUM_SIGNING_SEED_V2 is not set: no rotated key yet"; exit 0; }
          echo "::add-mask::$IEUM_SIGNING_SEED_V2"
          pip install --quiet 'cryptography==50.0.2'
          python3 tools/derive_signing_key.py --seed-env IEUM_SIGNING_SEED_V2 "$RUNNER_TEMP/kh.p12" >/dev/null
          hash=$(python3 -c "import base64,sys
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.serialization import pkcs12
          k, c, _ = pkcs12.load_key_and_certificates(open(sys.argv[1], 'rb').read(), b'ieum-signing')
          print(base64.b64encode(c.fingerprint(hashes.SHA1())).decode())" "$RUNNER_TEMP/kh.p12")
          rm -f "$RUNNER_TEMP/kh.p12"
          [ "${#IEUM_SIGNING_SEED_V2}" -ge 32 ] || echo "::warning title=smoke::IEUM_SIGNING_SEED_V2 is shorter than 32 characters: release-apk will refuse it, make a longer one"
          echo "::notice title=smoke::Kakao key hash of the rotated key: $hash (add it in developers.kakao.com before IEUM_ROTATE=1, keep the old one)"
          echo "### Kakao key hash of the rotated key: \`$hash\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        if: steps.need.outputs.run == 'true'
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        if: steps.need.outputs.run == 'true'
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'
      # Restore only (device-test and release-apk save it): gradle-user is deleted below to make room for the emulator.
      - name: Restore Gradle cache
        if: steps.need.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            gradle-user/caches
            gradle-user/wrapper
          key: device-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Download the previous release APK
        if: steps.need.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.IEUM_INBOX_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error title=smoke::IEUM_INBOX_TOKEN secret is not set"; exit 1; }
          gh api "repos/$INBOX/contents/app/version.json" --jq .content | base64 -d > "$RUNNER_TEMP/version.json"
          asset=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['apk'].rsplit('/',1)[-1])" "$RUNNER_TEMP/version.json")
          gh api -H "Accept: application/octet-stream" "repos/$INBOX/releases/assets/$asset" > "$RUNNER_TEMP/previous.apk"
          python3 -c "import json,sys; print('PREV_CODE=' + str(json.load(open(sys.argv[1]))['versionCode']))" "$RUNNER_TEMP/version.json" >> "$GITHUB_ENV"
      - name: Build the new APK with the release signing key
        if: steps.need.outputs.run == 'true'
        env:
          IEUM_INBOX_TOKEN: ${{ secrets.IEUM_INBOX_TOKEN }}
          IEUM_SIGNING_SEED: ${{ secrets.IEUM_SIGNING_SEED }}
          ROTATE: ${{ vars.IEUM_ROTATE }}
          REHEARSE: ${{ inputs.rotate_test }}
          IEUM_SIGNING_SEED_V2: ${{ vars.IEUM_ROTATE == '1' && secrets.IEUM_SIGNING_SEED_V2 || '' }}
        run: |
          [ -z "$IEUM_SIGNING_SEED" ] || echo "::add-mask::$IEUM_SIGNING_SEED"
          [ -z "$IEUM_SIGNING_SEED_V2" ] || echo "::add-mask::$IEUM_SIGNING_SEED_V2"
          # Pinned: the certificate must come out byte-identical every build (checked with 50.0.1 and 50.0.2: same fingerprint).
          pip install --quiet 'cryptography==50.0.2'
          # Same keys as release-apk: the new key when IEUM_ROTATE=1, else the release key (a rehearsal re-signs below).
          if [ "$ROTATE" = "1" ]; then python3 tools/derive_signing_key.py --seed-env IEUM_SIGNING_SEED_V2 "$RUNNER_TEMP/ieum.p12"
          else python3 tools/derive_signing_key.py "$RUNNER_TEMP/ieum.p12"; fi
          export ANDROID_SDK_ROOT="$ANDROID_HOME" \
            IEUM_ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358" IEUM_CMAKE_BINARY="$ANDROID_HOME/cmake/3.22.1/bin/cmake" \
            IEUM_SIGNING_KEYSTORE="$RUNNER_TEMP/ieum.p12" IEUM_VERSION_CODE=$((PREV_CODE + 1))
          # r18-lock: the release build type, as release-apk publishes it.
          python3 run_gradle.py --log smoke-build.log :app:assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/new.apk"
          # The second rotated build (one version code higher), for the "again with the same lineage" install.
          if [ "$ROTATE" = "1" ] || [ "$REHEARSE" = "true" ]; then
            IEUM_VERSION_CODE=$((PREV_CODE + 2)) python3 run_gradle.py --log smoke-build-2.log :app:assembleRelease
            cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/next.apk"
          fi
          rm -f "$RUNNER_TEMP/ieum.p12"
      # Same signing as release-apk: with IEUM_ROTATE=1 the new key and the mailbox's stored lineage (made here, not stored,
      # when there is none yet). A manual rotate_test run rehearses the first rotation with a random key that exists only in
      # this run (no new secret needed): the lineage from the release key, the old key deleted at once, then both builds
      # signed with the new key and that lineage only. Nothing is written to the mailbox.
      - name: Re-sign with the key lineage (IEUM_ROTATE=1 or rotate_test)
        if: steps.need.outputs.run == 'true' && (vars.IEUM_ROTATE == '1' || inputs.rotate_test)
        env:
          GH_TOKEN: ${{ secrets.IEUM_INBOX_TOKEN }}
          IEUM_INBOX_TOKEN: ${{ secrets.IEUM_INBOX_TOKEN }}
          IEUM_SIGNING_SEED: ${{ secrets.IEUM_SIGNING_SEED }}
          IEUM_SIGNING_SEED_V2: ${{ vars.IEUM_ROTATE == '1' && secrets.IEUM_SIGNING_SEED_V2 || '' }}
        run: |
          [ -z "$IEUM_SIGNING_SEED" ] || echo "::add-mask::$IEUM_SIGNING_SEED"
          rehearsal=0
          if [ -z "$IEUM_SIGNING_SEED_V2" ]; then
            [ "${{ vars.IEUM_ROTATE }}" != "1" ] || { echo "::error title=smoke::IEUM_ROTATE is 1 but IEUM_SIGNING_SEED_V2 is not set"; exit 1; }
            IEUM_SIGNING_SEED_V2=$(python3 -c "import secrets; print(secrets.token_hex(32))"); echo "rehearsal: throwaway new key"
            rehearsal=1
          fi
          echo "::add-mask::$IEUM_SIGNING_SEED_V2"; export IEUM_SIGNING_SEED_V2
          export APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          dir="$RUNNER_TEMP/rotate"; lin="$RUNNER_TEMP/signing-lineage.bin"
          bash tools/rotate_signing_key.sh newkey "$dir"
          if [ "$rehearsal" = "0" ] && got=$(gh api "repos/$INBOX/contents/app/signing-lineage.bin" --jq .content 2>/dev/null); then
            echo "$got" | base64 -d > "$lin"; echo "stored lineage from the mailbox"
          else
            bash tools/rotate_signing_key.sh lineage "$dir" "$lin"
          fi
          # From here on only the new key and the lineage file (lineage deleted old.p12 already).
          [ ! -e "$dir/old.p12" ] || { echo "::error title=smoke::the old key is still there"; exit 1; }
          bash tools/rotate_signing_key.sh sign "$dir" "$lin" "$RUNNER_TEMP/new.apk"
          bash tools/rotate_signing_key.sh sign "$dir" "$lin" "$RUNNER_TEMP/next.apk"
          bash tools/rotate_signing_key.sh check "$lin" "$(cat "$dir/new.sha256")" "$RUNNER_TEMP/previous.apk" "$RUNNER_TEMP/version.json"
          bash tools/rotate_signing_key.sh check "$lin" "$(cat "$dir/new.sha256")" "$RUNNER_TEMP/new.apk"
          rm -f "$dir/"*.p12
          echo "IEUM_SMOKE_ROTATED=1" >> "$GITHUB_ENV"
      # The emulator needs about 7.4 GB free for its userdata partition; after the SDK, NDK and the Gradle build the
      # runner had 4.3 GB and the emulator stopped at once ("Not enough space to create userdata partition"), which
      # showed only as "Timeout waiting for emulator to boot". Same clean-up as device-test.
      - name: Free runner disk
        if: steps.need.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          rm -rf android/app/build/intermediates android/app/build/tmp android/app/build/android-whisper gradle-user || true
          df -h / | tail -1
      - name: Enable KVM
        if: steps.need.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm && [ -r /dev/kvm ] && [ -w /dev/kvm ] || { echo "::error title=kvm::/dev/kvm not usable: the emulator would run without acceleration"; exit 1; }
      # Same AVD and snapshot as device-test (same cache key, so a snapshot made by either is reused).
      - name: Restore AVD snapshot
        id: avd
        if: steps.need.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-c4-r4096-d4G-v1
      - name: Create AVD snapshot (cache miss only)
        id: avdmake
        if: steps.need.outputs.run == 'true' && steps.avd.outputs.cache-hit != 'true'
        continue-on-error: true # a boot failure here is retried by the attempts below
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 4G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot made"
      - name: Save AVD snapshot
        if: steps.need.outputs.run == 'true' && steps.avd.outputs.cache-hit != 'true' && steps.avdmake.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd.outputs.cache-primary-key }}
      # The script only runs once the emulator has booted, so smoke-results/booted tells an infrastructure failure
      # (the emulator never came up: retried once) from an app failure (install, update or start failed: never retried).
      - name: Emulator attempt 1
        id: try1
        if: steps.need.outputs.run == 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 4G
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: mkdir -p smoke-results && echo booted > smoke-results/booted && IEUM_SMOKE_NEXT=${{ runner.temp }}/next.apk bash tools/update_smoke.sh ${{ runner.temp }}/previous.apk ${{ runner.temp }}/new.apk smoke-results
      - name: Check whether the emulator booted
        id: boot1
        if: steps.need.outputs.run == 'true'
        run: |
          if [ -f smoke-results/booted ]; then echo "booted=true" >> "$GITHUB_OUTPUT"
          else echo "booted=false" >> "$GITHUB_OUTPUT"; echo "::warning title=smoke::emulator did not boot (attempt 1), retrying once"; fi
      - name: Emulator attempt 2 (emulator did not boot)
        id: try2
        if: steps.need.outputs.run == 'true' && steps.boot1.outputs.booted == 'false'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 4G
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: mkdir -p smoke-results && echo booted > smoke-results/booted && IEUM_SMOKE_NEXT=${{ runner.temp }}/next.apk bash tools/update_smoke.sh ${{ runner.temp }}/previous.apk ${{ runner.temp }}/new.apk smoke-results
      # release-apk reads these two step names: keep them.
      #   "Emulator did not boot (infra)" failed  -> the emulator never came up in two attempts: release-apk only warns.
      #   "Install, update, start" success        -> the app installed over the previous release and started.
      #   "Install, update, start" failed         -> the app failed to install, update or start: release-apk stops.
      - name: Emulator did not boot (infra)
        if: steps.need.outputs.run == 'true' && !(hashFiles('smoke-results/booted') != '')
        run: |
          echo "::error title=smoke::the emulator did not boot in two attempts (runner problem, not the app)"; exit 1
      - name: Install, update, start
        if: steps.need.outputs.run == 'true' && hashFiles('smoke-results/booted') != ''
        env:
          OUT1: ${{ steps.try1.outcome }}
          OUT2: ${{ steps.try2.outcome }}
        run: |
          r="$OUT1"; [ "$OUT2" = "skipped" ] || [ -z "$OUT2" ] || r="$OUT2"
          echo "emulator test: $r"; ls smoke-results
          [ "$r" = "success" ] || { echo "::error title=smoke::the app failed to install over the previous release, update or start (see the emulator attempt log)"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always() && steps.need.outputs.run == 'true'
        with:
          name: update-smoke-results
          retention-days: 7
          path: |
            smoke-results/
            evidence/smoke-build*.log
