name: ieum-daily

# Daily pipeline run (docs/pipeline-server.md): decrypt new transcripts from the private ieum-inbox
# repository, analyse them with Claude, write sealed C2 analyses and the C3 morning report back.
# 20:07 UTC = 05:07 KST; 20:37 UTC = 05:37 KST is the safety re-run (idempotent).
on:
  schedule:
    - cron: '7 20 * * *'
    - cron: '37 20 * * *'
  workflow_dispatch:

concurrency:
  group: ieum-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      INBOX_REPOSITORY: ${{ vars.IEUM_INBOX_REPOSITORY || 'bllue583-commits/ieum-inbox' }}
    steps:
      - name: Check configuration
        id: cfg
        env:
          HAS_SIGNING: ${{ secrets.IEUM_SERVER_SIGNING_KEY != '' }}
          HAS_ENCRYPTION: ${{ secrets.IEUM_SERVER_ENCRYPTION_KEY != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_INBOX: ${{ secrets.IEUM_INBOX_TOKEN != '' }}
        run: |
          missing=""
          [ "$HAS_SIGNING" = true ] || missing="$missing IEUM_SERVER_SIGNING_KEY"
          [ "$HAS_ENCRYPTION" = true ] || missing="$missing IEUM_SERVER_ENCRYPTION_KEY"
          [ "$HAS_ANTHROPIC" = true ] || missing="$missing ANTHROPIC_API_KEY"
          [ "$HAS_INBOX" = true ] || missing="$missing IEUM_INBOX_TOKEN"
          if [ -n "$missing" ]; then
            echo "::notice title=ieum-daily::pipeline not configured (missing secrets:$missing); nothing done. See docs/pipeline-server.md"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          path: app
          persist-credentials: false

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          repository: ${{ env.INBOX_REPOSITORY }}
          token: ${{ secrets.IEUM_INBOX_TOKEN }}
          path: inbox
          fetch-depth: 0

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with: {node-version: '22'}

      - name: Run pipeline
        if: steps.cfg.outputs.ok == 'true'
        env:
          INBOX_DIR: ${{ github.workspace }}/inbox
          IEUM_SERVER_SIGNING_KEY: ${{ secrets.IEUM_SERVER_SIGNING_KEY }}
          IEUM_SERVER_ENCRYPTION_KEY: ${{ secrets.IEUM_SERVER_ENCRYPTION_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IEUM_MODEL: ${{ vars.IEUM_MODEL }}
          IEUM_ACCEPT_DEVICE_ID: ${{ vars.IEUM_ACCEPT_DEVICE_ID }}
        run: |
          node app/worker/src/pipeline/run.mjs | tee run-summary.txt
          { echo '### ieum-daily'; echo '```'; tail -n 1 run-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push inbox changes
        if: steps.cfg.outputs.ok == 'true'
        working-directory: inbox
        run: |
          set -euo pipefail
          git config user.name ieum-bot
          git config user.email ieum-bot@users.noreply.github.com
          branch="$(git rev-parse --abbrev-ref HEAD)"
          base="$(git rev-parse HEAD)"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "ieum-daily $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M%z)"
          fi
          # Monday (KST) history rewrite: the first run of each Monday replaces the whole history with one
          # orphan commit of the current tree, so files deleted by retention (7-day transcripts) are really gone.
          root_day="$(TZ=Asia/Seoul git log --max-parents=0 --format=%cd --date=format-local:%Y-%m-%d HEAD)"
          today="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          if [ "$(TZ=Asia/Seoul date +%u)" = 1 ] && [ "$root_day" != "$today" ] && [ "$(git rev-list --count HEAD)" -gt 1 ]; then
            git checkout -q --orphan ieum-squash
            git commit -q -m "ieum-daily weekly history reset $today"
            if git push --force-with-lease="refs/heads/$branch:$base" origin "HEAD:$branch"; then
              echo "::notice title=ieum-daily::inbox history reset to a single commit"
              exit 0
            fi
            # the phone pushed meanwhile: keep its commits, push normally, the 05:37 run retries the reset
            echo "::warning title=ieum-daily::history reset skipped (concurrent push); retried next run"
            git checkout -q "$branch"
          fi
          [ "$(git rev-parse HEAD)" != "$base" ] || { echo "no inbox changes"; exit 0; }
          for attempt in 1 2 3; do
            if git push -q origin "HEAD:$branch"; then exit 0; fi
            sleep $((attempt * 5))
            git pull -q --rebase origin "$branch"
          done
          echo "::error title=ieum-daily::push to inbox failed"
          exit 1
