name: watchdog

# SOURCE COPY. Lives in the app repository so it is reviewed with the app; copy it to ieum-inbox as
# .github/workflows/watchdog.yml together with tools/inbox/watchdog.py (to ieum-inbox as tools/watchdog.py, the path used below).
# Every 3 hours it reads status/phone.json, status/last-run.json and the age of inbox/ files (times, counts and yes/no
# values only, never call content), opens one GitHub issue per problem, and closes the issue when the problem is gone.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LABEL: ieum-watch
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # The mailbox token's expiry is in status/phone.json (tokenExpiresMs): the phone reads the
      # github-authentication-token-expiration header of its own replies. The workflow token never carries it.
      - name: Open watchdog issues
        run: gh issue list --label "$LABEL" --state open --json number,title --limit 100 > "$RUNNER_TEMP/open.json"
      - name: Decide
        run: python3 tools/watchdog.py --root . --open-issues "$RUNNER_TEMP/open.json" --out "$RUNNER_TEMP/plan.json"
      - name: Open and close issues
        run: |
          gh label create "$LABEL" --color D93F0B --description "ieum watchdog" 2>/dev/null || true
          # New problem with no open issue of the same title: one issue. An open one already says it: nothing, not even a comment.
          jq -c '.create[]' "$RUNNER_TEMP/plan.json" | while read -r p; do
            jq -r .body <<<"$p" > "$RUNNER_TEMP/body.md"
            gh issue create --title "$(jq -r .title <<<"$p")" --label "$LABEL" --body-file "$RUNNER_TEMP/body.md"
          done
          # Open issue whose problem is gone: close it.
          jq -r '.close[]' "$RUNNER_TEMP/plan.json" | while read -r num; do
            gh issue close "$num" --comment "정상으로 돌아왔어요."
          done
          echo "watchdog: $(jq '.create|length' "$RUNNER_TEMP/plan.json") opened, $(jq '.close|length' "$RUNNER_TEMP/plan.json") closed" >> "$GITHUB_STEP_SUMMARY"
