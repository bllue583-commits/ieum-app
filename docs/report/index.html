<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- r18 (user 11/13): the morning report's web view. The report rides in the URL fragment (#d=, zlib + base64url), which the
     browser never sends to the server; this page calls nothing outside itself (no script, font or analytics; the policy below
     forbids any request). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>이음 아침 보고</title>
<style>
:root{--bg:#f2f4f6;--card:#ffffff;--ink:#191f28;--sub:#6b7684;--line:#e5e8eb;--accent:#3268f0;
  --t-important:#e5484d;--t-confirm:#d98a00;--t-request:#3268f0;--t-regular:#12a150;--t-optional:#8b95a1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101215;--card:#1b1e23;--ink:#eceef1;--sub:#9aa4b0;--line:#2b3038;--accent:#6f96ff;
  --t-important:#ff6b6f;--t-confirm:#f0b030;--t-request:#6f96ff;--t-regular:#3dcc7a;--t-optional:#9aa4b0}}
:root[data-theme="dark"]{--bg:#101215;--card:#1b1e23;--ink:#eceef1;--sub:#9aa4b0;--line:#2b3038;--accent:#6f96ff;
  --t-important:#ff6b6f;--t-confirm:#f0b030;--t-request:#6f96ff;--t-regular:#3dcc7a;--t-optional:#9aa4b0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;line-height:1.3;margin:4px 0 6px}
.head{color:var(--sub);margin:0 0 4px}
.note{color:var(--sub);font-size:16px;margin:8px 0 0}
section{background:var(--card);border-radius:16px;padding:16px;margin-top:14px}
h2{font-size:19px;margin:0 0 10px;color:var(--accent)}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0;padding-top:0}
li:last-child{padding-bottom:0}
.row{display:flex;gap:10px;align-items:flex-start}
.tag{flex:none;font-size:15px;font-weight:700;line-height:1;padding:6px 8px;border-radius:8px;color:#fff;margin-top:2px}
.what{font-weight:600}
.sub{color:var(--sub);font-size:16px}
.empty{color:var(--sub)}
.msg{background:var(--card);border-radius:16px;padding:20px 16px;margin-top:14px}
</style>
</head>
<body>
<main id="page">
  <h1>이음 아침 보고</h1>
  <p class="msg" id="msg">보고를 여는 중이에요</p>
</main>
<script>
/* DECODE:BEGIN (tools/test_report_page.py runs this block in node) */
var TAGS={important:"중요",confirm:"확인",request:"요청",regular:"정기",optional:"선택"};
async function decodeReport(d){
  var b64=d.replace(/-/g,"+").replace(/_/g,"/");
  while(b64.length%4)b64+="=";
  var bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  var stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return JSON.parse(await new Response(stream).text());
}
/* DECODE:END */
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function list(title,rows,draw,empty){
  if(!rows.length&&!empty)return null;
  var s=el("section");s.appendChild(el("h2",null,title));
  if(!rows.length){s.appendChild(el("p","empty",empty));return s}
  var ul=el("ul");rows.forEach(function(r){var li=el("li");draw(li,r);ul.appendChild(li)});s.appendChild(ul);return s;
}
function line(li,main,sub){li.appendChild(el("div","what",main));if(sub)li.appendChild(el("div","sub",sub))}
function show(r){
  var p=document.getElementById("page");p.textContent="";
  var h=r.head||{};
  p.appendChild(el("h1",null,(r.label||r.day||"")+" 아침 보고"));
  var first=(h.calls>0?"어제 통화 "+h.calls+"건을 정리했어요":"어제 정리한 통화가 없어요")+(h.pendingCalls>0?". "+h.pendingCalls+"건은 아직 글자로 바꾸는 중이에요":"");
  p.appendChild(el("p","head",first));
  p.appendChild(el("p","head","새 체크 "+(h.newChecks||0)+"개, 오늘 챙길 일 "+(h.todayChecks||0)+"개"));
  if(r.phone)p.appendChild(el("p","note","새벽 정리 없이 폰에서 만든 보고예요"));
  var blocks=[
    list("오늘 챙길 일",r.today||[],function(li,t){
      var row=el("div","row"),tag=TAGS[t.tag]?t.tag:"request",chip=el("span","tag",TAGS[tag]);
      chip.style.background="var(--t-"+tag+")";row.appendChild(chip);
      var body=el("div");line(body,t.what,[t.since,t.who,t.status].filter(Boolean).join(", "));row.appendChild(body);li.appendChild(row);
    },"새로 챙길 일 없음"),
    list("진행 중",r.inProgress||[],function(li,x){line(li,x.what)}),
    list("확인 필요",r.check||[],function(li,x){line(li,x.what,x.who)}),
    list("어제 정리",r.yesterday||[],function(li,x){line(li,x.who,x.what)},h.calls>0?null:"어제 업무 통화 없음"),
    list("뒤늦게 정리된 통화",r.late||[],function(li,x){line(li,x.who,x.what)})
  ];
  blocks.forEach(function(b){if(b)p.appendChild(b)});
  if(r.cut)p.appendChild(el("p","note","나머지는 이음에서 볼 수 있어요"));
}
(function(){
  var msg=document.getElementById("msg");
  var m=/(?:^#|&)d=([A-Za-z0-9_-]+)/.exec(location.hash||"");
  if(!m){msg.textContent="보고 내용이 없어요. 카카오톡의 아침 보고에서 [웹으로 보기]를 눌러 주세요";return}
  if(typeof DecompressionStream==="undefined"){msg.textContent="이 브라우저에서는 보고를 열 수 없어요. 이음 앱에서 볼 수 있어요";return}
  decodeReport(m[1]).then(show,function(){msg.textContent="보고를 읽지 못했어요. 이음 앱에서 볼 수 있어요"});
})();
</script>
</body>
</html>
