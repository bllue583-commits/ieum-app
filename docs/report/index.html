<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- r18 (user 11/13): the morning report's web view. The report rides in the URL fragment (#d=, zlib + base64url), which the
     browser never sends to the server; this page calls nothing outside itself (no script, font or analytics; the policy below
     forbids any request). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>이음 아침 보고</title>
<style>
:root{--bg:#f2f4f6;--card:#ffffff;--ink:#191f28;--sub:#6b7684;--line:#e5e8eb;--accent:#3268f0;
  --t-important:#e5484d;--t-confirm:#d98a00;--t-request:#3268f0;--t-regular:#12a150;--t-optional:#8b95a1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101215;--card:#1b1e23;--ink:#eceef1;--sub:#9aa4b0;--line:#2b3038;--accent:#6f96ff;
  --t-important:#ff6b6f;--t-confirm:#f0b030;--t-request:#6f96ff;--t-regular:#3dcc7a;--t-optional:#9aa4b0}}
:root[data-theme="dark"]{--bg:#101215;--card:#1b1e23;--ink:#eceef1;--sub:#9aa4b0;--line:#2b3038;--accent:#6f96ff;
  --t-important:#ff6b6f;--t-confirm:#f0b030;--t-request:#6f96ff;--t-regular:#3dcc7a;--t-optional:#9aa4b0}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;line-height:1.3;margin:4px 0 6px}
.head{color:var(--sub);margin:0 0 4px}
.note{color:var(--sub);font-size:16px;margin:8px 0 0}
section{background:var(--card);border-radius:16px;padding:16px;margin-top:14px}
h2{font-size:19px;margin:0 0 10px;color:var(--accent)}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0;padding-top:0}
li:last-child{padding-bottom:0}
.row{display:flex;gap:10px;align-items:flex-start}
.tag{flex:none;font-size:15px;font-weight:700;line-height:1;padding:6px 8px;border-radius:8px;color:#fff;margin-top:2px}
.what{font-weight:600}
.sub{color:var(--sub);font-size:16px}
.empty{color:var(--sub)}
.msg{background:var(--card);border-radius:16px;padding:20px 16px;margin-top:14px}
/* v4.2 (user 11/20: 미려함): the three numbers of the morning at a glance, and a count beside each list's title. */
.stats{display:flex;gap:8px;margin:12px 0 0}
.stat{flex:1;background:var(--card);border-radius:14px;padding:12px 8px 10px;text-align:center;min-width:0}
.stat b{display:block;font-size:26px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--sub);font-size:14px;margin-top:2px;white-space:nowrap}
.stat.key b{color:var(--accent)}
h2 .n{color:var(--sub);font-weight:600;font-size:16px;margin-left:6px}
main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
/* v4.4 r25-2: the board's blocks (전화할 곳, 답을 기다리는 중, 이번 주 일정, 진행 중의 상태와 며칠째, 끝났는지 확인할 일, 달라진 것). */
.main{flex:1;min-width:0}
.days{flex:none;min-width:3.2em;text-align:right;font-size:16px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}
.days.long{color:var(--t-confirm);font-weight:700}
.unsure{display:inline-block;font-size:14px;font-weight:700;line-height:1;padding:4px 6px;border-radius:6px;color:var(--t-confirm);border:1px solid var(--t-confirm);margin-left:6px;vertical-align:2px}
.day{padding:12px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0;padding-top:0}
.day:last-child{padding-bottom:0}
.dayhead{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.dayhead b{font-size:17px}
.dayhead .near{color:var(--accent)}
.dayhead span{color:var(--sub);font-size:15px}
.day ul li{padding:3px 0 3px 14px;border-top:0;position:relative}
.day ul li:before{content:"";position:absolute;left:2px;top:.75em;width:5px;height:5px;border-radius:50%;background:var(--sub)}
.changed li{padding:8px 0}
/* r25 review (사용성): a long block shows its first rows; the rest opens with "n개 더 보기" (details/summary, no script). */
.basis{color:var(--sub);font-size:15px;margin:10px 2px 0}
details.more{margin-top:2px}
details.more summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--accent);font-size:16px;font-weight:600;padding:12px 0 2px;border-top:1px solid var(--line);margin-top:10px;-webkit-tap-highlight-color:transparent}
details.more summary::-webkit-details-marker{display:none}
details.more summary:after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:-3px 0 0 4px;transition:transform .15s}
details.more[open] summary{display:none}
details.more ul li:first-child{border-top:1px solid var(--line);padding-top:10px}
details.more .day:first-of-type{border-top:1px solid var(--line);padding-top:12px}
/* v4.5 r26-2: the forecast beside a day's date ("비 70%  -1°/6°"), the forecast facts under its lines, and the source. */
.dayhead .wx{color:var(--sub);font-size:15px;white-space:pre;font-variant-numeric:tabular-nums}
.caution{color:var(--t-confirm);font-size:15px;font-weight:600;margin:4px 0 0 14px}
.src{color:var(--sub);font-size:13px;margin:12px 0 0}
details.more .day ul li:first-child{border-top:0;padding-top:3px}
</style>
</head>
<body>
<main id="page">
  <h1>이음 아침 보고</h1>
  <p class="msg" id="msg">보고를 여는 중이에요</p>
</main>
<script>
/* DECODE:BEGIN (tools/test_report_page.py runs this block in node) */
var TAGS={important:"중요",confirm:"확인",request:"요청",regular:"정기",optional:"선택"};
async function decodeReport(d){
  var b64=d.replace(/-/g,"+").replace(/_/g,"/");
  while(b64.length%4)b64+="=";
  var bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  var stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return JSON.parse(await new Response(stream).text());
}
/* DECODE:END */
/* WX:BEGIN (tools/test_report_page.py runs this block in node; the same words as the phone's Weather.kt) */
/* x: [weather_code, rain chance %, rain mm, min, max, mean, gust m/s, next day's min]; k: caution kinds (1 cold, 2 rain, 3 wind). */
var COLD_RULE="한중 콘크리트 기준: 일평균 4℃ 이하 또는 타설 뒤 24시간 최저 0℃ 이하";
function wxN(v){return typeof v==="number"&&isFinite(v)}
function wxSky(c){if(!wxN(c))return null;if(c===0||c===1)return "맑음";if(c===2)return "구름";if(c===3||c===45||c===48)return "흐림";
  if(c>=51&&c<=67)return "비";if((c>=71&&c<=77)||c===85||c===86)return "눈";if(c>=80&&c<=82)return "소나기";if(c>=95&&c<=99)return "뇌우";return null}
function wxSnow(c){return wxN(c)&&((c>=71&&c<=77)||c===85||c===86)}
function wxDeg(v){var r=Math.round(v);return String(r===0?0:r)}
function wxNum(v){var r=Math.round(v*10)/10,w=Math.round(r);return Math.abs(r-w)<1e-9?String(w===0?0:w):r.toFixed(1)}
function wxHead(x){
  if(!Array.isArray(x))return null;
  var a=wxN(x[1])&&x[1]>=30?(wxSnow(x[0])?"눈":"비")+" "+x[1]+"%":wxSky(x[0]);
  var t=wxN(x[3])&&wxN(x[4])?wxDeg(x[3])+"°/"+wxDeg(x[4])+"°":null;
  return [a,t].filter(Boolean).join("  ")||null;
}
function wxCaution(k,x){
  if(!Array.isArray(x))return null;
  if(k===1){var p=[wxN(x[5])?"일평균 "+wxNum(x[5])+"℃":null,wxN(x[7])?"다음 날 최저 "+wxNum(x[7])+"℃":null].filter(Boolean);
    return p.length?p.join(", ")+" 예상 ("+COLD_RULE+")":null}
  if(k===2&&wxN(x[1]))return (wxSnow(x[0])?"눈":"비")+" 올 확률 "+x[1]+"%"+(wxN(x[2])?", 예상 강수 "+wxNum(x[2])+"mm":"");
  if(k===3&&wxN(x[6]))return "순간풍속 "+wxNum(x[6])+"m/s 예상";
  return null;
}
/* WX:END */
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
var SHOW=5;
/* The rows after the first [n] of a block, behind "m개 더 보기" (opened, the line goes and the rows stay). */
function more(s,n,label,fill){var d=el("details","more");d.appendChild(el("summary",null,n+label+" 더 보기"));fill(d);s.appendChild(d)}
function list(title,rows,draw,empty,all){
  if(!rows.length&&!empty)return null;
  var s=el("section"),h2=el("h2",null,title);if(rows.length>1)h2.appendChild(el("span","n",String(rows.length)));s.appendChild(h2);
  if(!rows.length){s.appendChild(el("p","empty",empty));return s}
  var n=all?rows.length:Math.min(rows.length,SHOW);
  function fill(box,part){var ul=el("ul");part.forEach(function(r){var li=el("li");draw(li,r);ul.appendChild(li)});box.appendChild(ul)}
  fill(s,rows.slice(0,n));
  if(rows.length>n)more(s,rows.length-n,"개",function(d){fill(d,rows.slice(n))});
  return s;
}
function line(li,main,sub){li.appendChild(el("div","what",main));if(sub)li.appendChild(el("div","sub",sub))}
/* v4.4 r25-2: a row with "n일째" on the right (a wait of more than 7 days in amber) and the "확인 필요" mark after the main words. */
function dayRow(li,main,sub,days,unsure,warn){
  var row=el("div","row"),body=el("div","main"),w=el("div","what",main);
  if(unsure)w.appendChild(el("span","unsure","확인 필요"));
  body.appendChild(w);if(sub)body.appendChild(el("div","sub",sub));row.appendChild(body);
  if(typeof days==="number"&&days>=0)row.appendChild(el("div","days"+(warn&&days>7?" long":""),days+"일째"));
  li.appendChild(row);
}
function who(x){return [x.company,x.who].filter(Boolean).join(" ")}
function weekBlock(days,site){
  if(!days.length)return null;
  var n=0;days.forEach(function(d){n+=(d.items||[]).length});
  var s=el("section"),h2=el("h2",null,"이번 주 일정");if(n>1)h2.appendChild(el("span","n",String(n)));s.appendChild(h2);
  function day(into,d){
    var box=el("div","day"),head=el("div","dayhead");
    if(d.near){head.appendChild(el("b","near",d.near));head.appendChild(el("span",null,d.label||d.date))}
    else head.appendChild(el("b",null,d.label||d.date));
    var wx=wxHead(d.x);if(wx){head.appendChild(el("span","wx",wx));shown=true}
    box.appendChild(head);var ul=el("ul");(d.items||[]).forEach(function(t){ul.appendChild(el("li",null,t))});box.appendChild(ul);
    (Array.isArray(d.k)?d.k:[]).slice(0,2).forEach(function(k){var c=wxCaution(k,d.x);if(c)box.appendChild(el("p","caution",c))});
    into.appendChild(box);
  }
  var shown=false;
  /* Today, tomorrow and the day after shown; the other days behind "n일 더 보기". */
  days.slice(0,3).forEach(function(d){day(s,d)});
  if(days.length>3)more(s,days.length-3,"일",function(dd){days.slice(3).forEach(function(d){day(dd,d)})});
  if(shown)s.appendChild(el("p","src","날씨 Open-Meteo, "+(site||"인천")+" 기준"));
  return s;
}
function show(r){
  var p=document.getElementById("page");p.textContent="";
  var h=r.head||{};
  p.appendChild(el("h1",null,(r.label||r.day||"")+" 아침 보고"));
  var stats=el("div","stats");
  [["오늘 챙길 일",h.todayChecks||0,"key"],["새 체크",h.newChecks||0,""],["어제 통화",h.calls||0,""]].forEach(function(x){
    var c=el("div","stat"+(x[2]?" "+x[2]:""));c.appendChild(el("b",null,String(x[1])));c.appendChild(el("span",null,x[0]));stats.appendChild(c)});
  p.appendChild(stats);
  if(r.label||r.day)p.appendChild(el("p","basis",(r.label||r.day)+" 아침 보고 기준"));
  if(!(h.calls>0))p.appendChild(el("p","note","어제 정리한 통화가 없어요"));
  if(h.pendingCalls>0)p.appendChild(el("p","note","통화 "+h.pendingCalls+"건은 아직 글자로 바꾸는 중이에요"));
  if(h.failedCalls>0)p.appendChild(el("p","note","어제 글자로 못 바꾼 통화가 "+h.failedCalls+"건 있어요"));
  if(r.phone)p.appendChild(el("p","note","새벽 정리 없이 폰에서 만든 보고예요"));
  var blocks=[
    list("오늘 챙길 일",r.today||[],function(li,t){
      var row=el("div","row"),tag=TAGS[t.tag]?t.tag:"request",chip=el("span","tag",TAGS[tag]);
      chip.style.background="var(--t-"+tag+")";row.appendChild(chip);
      var body=el("div");line(body,t.what,[t.since,t.who,t.status].filter(Boolean).join(", "));row.appendChild(body);li.appendChild(row);
    },"새로 챙길 일 없음",true),
    list("전화할 곳",r.calls||[],function(li,x){var name=who(x);
      dayRow(li,name||x.what,[name?x.what:"",x.since?"마지막 연락 "+x.since:""].filter(Boolean).join(", "),null,x.unsure)}),
    list("답을 기다리는 중",r.waiting||[],function(li,x){var name=who(x);
      dayRow(li,name||x.what,[name?x.what:"",x.since?x.since+" 약속":""].filter(Boolean).join(", "),x.days,x.unsure,true)}),
    weekBlock(r.week||[],r.wl),
    list("진행 중",r.inProgress||[],function(li,x){if(x.status||typeof x.days==="number"||x.unsure)dayRow(li,x.what,x.status,x.days,x.unsure);else line(li,x.what)}),
    list("확인 필요",r.check||[],function(li,x){line(li,x.what,x.who)}),
    list("끝났는지 확인할 일",r.doneCheck||[],function(li,x){line(li,x.what,x.who)}),
    list("어제 정리",r.yesterday||[],function(li,x){line(li,x.who,x.what)},h.calls>0?null:"어제 업무 통화 없음"),
    list("뒤늦게 정리된 통화",r.late||[],function(li,x){line(li,x.who,x.what)}),
    list("어제와 달라진 것",r.changed||[],function(li,x){li.appendChild(el("div",null,x))})
  ];
  if(blocks[blocks.length-1])blocks[blocks.length-1].className="changed";
  blocks.forEach(function(b){if(b)p.appendChild(b)});
  if(r.cut)p.appendChild(el("p","note","더 많은 내용은 앱에서 볼 수 있어요"));
}
(function(){
  var msg=document.getElementById("msg");
  var m=/(?:^#|&)d=([A-Za-z0-9_-]+)/.exec(location.hash||"");
  if(!m){msg.textContent="보고 내용이 없어요. 카카오톡의 아침 보고에서 [웹으로 보기]를 눌러 주세요";return}
  if(typeof DecompressionStream==="undefined"){msg.textContent="이 브라우저에서는 보고를 열 수 없어요. 이음 앱에서 볼 수 있어요";return}
  decodeReport(m[1]).then(show,function(){msg.textContent="보고를 읽지 못했어요. 이음 앱에서 볼 수 있어요"});
})();
</script>
</body>
</html>
